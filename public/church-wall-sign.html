<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HBG Church Wall Sign</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Manrope', sans-serif;
    }

    /*
      Sign proportions: 150cm × 60cm = 2.5 : 1
      Screen: 900px × 360px
    */
    .sign {
      width: 900px;
      height: 360px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;

      /* Dark panel base */
      background: radial-gradient(ellipse 80% 70% at 50% 50%,
        #1a0828 0%,
        #0f0518 50%,
        #060210 100%
      );

      /* Outer glow — sign is lit from within */
      box-shadow:
        0 0 0 3px rgba(212,175,55,0.5),
        0 0 0 6px rgba(212,175,55,0.08),
        0 0 40px rgba(212,175,55,0.25),
        0 0 80px rgba(180,80,220,0.15),
        0 20px 60px rgba(0,0,0,0.8);
    }

    /* ── Backlight glow behind content ── */
    .backlight {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 80% at 20% 50%, rgba(180,80,220,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 50%, rgba(212,175,55,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(200,162,208,0.06) 0%, transparent 70%);
      animation: backlightBreath 6s ease-in-out infinite;
    }
    @keyframes backlightBreath {
      0%,100% { opacity: 0.8; }
      50%      { opacity: 1; }
    }

    /* ── Gold border frame ── */
    .frame {
      position: absolute;
      inset: 10px;
      border: 1.5px solid rgba(212,175,55,0.4);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: inset 0 0 30px rgba(212,175,55,0.04);
    }

    /* Corner accents */
    .frame::before, .frame::after {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      border-color: rgba(212,175,55,0.8);
      border-style: solid;
    }
    .frame::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
      border-radius: 4px 0 0 0;
    }
    .frame::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
      border-radius: 0 0 4px 0;
    }

    /* Extra corners */
    .corner-tr, .corner-bl {
      position: absolute;
      width: 24px; height: 24px;
      border-color: rgba(212,175,55,0.8);
      border-style: solid;
    }
    .corner-tr { top: 9px; right: 9px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .corner-bl { bottom: 9px; left: 9px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }

    /* ── Layout ── */
    .content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 50px;
      gap: 0;
    }

    /* LEFT: Logo block */
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 220px;
      padding-right: 40px;
      border-right: 1px solid rgba(212,175,55,0.2);
    }

    .logo-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter:
        drop-shadow(0 0 12px rgba(180,80,220,0.8))
        drop-shadow(0 0 24px rgba(200,100,240,0.4))
        drop-shadow(0 0 4px rgba(212,175,55,0.4));
      animation: logoGlow 4s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%,100% { filter: drop-shadow(0 0 12px rgba(180,80,220,0.8)) drop-shadow(0 0 24px rgba(200,100,240,0.4)); }
      50%      { filter: drop-shadow(0 0 20px rgba(180,80,220,1)) drop-shadow(0 0 40px rgba(220,140,255,0.5)) drop-shadow(0 0 6px rgba(212,175,55,0.6)); }
    }

    /* RIGHT: Text content */
    .text-block {
      flex: 1;
      padding-left: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    /* Ministry name */
    .ministry-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 62px;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      letter-spacing: 0.01em;
      color: #fff;
      text-shadow:
        0 0 20px rgba(212,175,55,0.6),
        0 0 40px rgba(212,175,55,0.3),
        0 0 80px rgba(200,162,208,0.2);
      animation: nameGlow 5s ease-in-out infinite;
      margin-bottom: 4px;
    }
    @keyframes nameGlow {
      0%,100% { text-shadow: 0 0 20px rgba(212,175,55,0.6), 0 0 40px rgba(212,175,55,0.3); }
      50%      { text-shadow: 0 0 30px rgba(212,175,55,0.9), 0 0 60px rgba(212,175,55,0.4), 0 0 100px rgba(200,162,208,0.2); }
    }

    .ministry-sub {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(212,175,55,0.75);
      text-shadow: 0 0 12px rgba(212,175,55,0.5);
      margin-bottom: 18px;
    }

    /* Gold divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(212,175,55,0.6), rgba(200,162,208,0.3), transparent);
      margin-bottom: 18px;
      position: relative;
    }
    .divider::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, rgba(212,175,55,0.6), rgba(200,162,208,0.3), transparent);
      filter: blur(2px);
    }

    /* Pastor row */
    .pastor-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .pastor-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(212,175,55,0.6);
      flex-shrink: 0;
    }

    .pastor-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.02em;
      text-shadow: 0 0 16px rgba(200,162,208,0.5);
    }

    /* Service times */
    .times-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .time-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 100px;
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.35);
      box-shadow: 0 0 12px rgba(212,175,55,0.15), inset 0 0 8px rgba(212,175,55,0.04);
      animation: pillGlow 4s ease-in-out infinite;
    }
    .time-pill:nth-child(3) { animation-delay: 2s; }
    @keyframes pillGlow {
      0%,100% { box-shadow: 0 0 12px rgba(212,175,55,0.15), inset 0 0 8px rgba(212,175,55,0.04); }
      50%      { box-shadow: 0 0 20px rgba(212,175,55,0.3), inset 0 0 12px rgba(212,175,55,0.08); }
    }

    .time-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #d4af37;
      box-shadow: 0 0 6px rgba(212,175,55,0.9), 0 0 12px rgba(212,175,55,0.5);
      animation: dotPulse 2s ease-in-out infinite;
    }
    .time-pill:nth-child(3) .time-dot { animation-delay: 1s; }
    @keyframes dotPulse {
      0%,100% { box-shadow: 0 0 6px rgba(212,175,55,0.9), 0 0 12px rgba(212,175,55,0.5); transform: scale(1); }
      50%      { box-shadow: 0 0 10px rgba(212,175,55,1), 0 0 20px rgba(212,175,55,0.7); transform: scale(1.3); }
    }

    .time-text {
      font-size: 12px;
      font-weight: 800;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.08em;
      text-shadow: 0 0 8px rgba(212,175,55,0.4);
    }

    .time-sep {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(212,175,55,0.3);
    }

    /* Tagline bottom-right */
    .tagline {
      position: absolute;
      bottom: 22px;
      right: 26px;
      font-size: 9px;
      font-weight: 400;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      color: rgba(212,175,55,0.35);
      letter-spacing: 0.1em;
    }

    /* Scan line subtle overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 20;
    }

    /* Print note */
    .print-note {
      margin-top: 28px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.12em;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="sign">
    <div class="backlight"></div>

    <!-- Gold frame -->
    <div class="frame"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <!-- Scanlines -->
    <div class="scanlines"></div>

    <div class="content">

      <!-- LEFT: Logo -->
      <div class="logo-block">
        <img class="logo-img" src="/hbg-logo.svg" alt="HBG Logo"
          onerror="this.src='/hbg-logo.png'" />
      </div>

      <!-- RIGHT: Text -->
      <div class="text-block">
        <div class="ministry-name">Heartbeat of God</div>
        <div class="ministry-sub">Ministry International</div>

        <div class="divider"></div>

        <div class="pastor-row">
          <span class="pastor-label">Host Pastor</span>
          <span class="pastor-name">Amos Unogwu</span>
        </div>

        <div class="times-row">
          <div class="time-pill">
            <div class="time-dot"></div>
            <span class="time-text">SUNDAY &nbsp;·&nbsp; 9:00 AM</span>
          </div>
          <div class="time-sep"></div>
          <div class="time-pill">
            <div class="time-dot"></div>
            <span class="time-text">WEDNESDAY &nbsp;·&nbsp; 6:00 PM</span>
          </div>
        </div>
      </div>

    </div>

    <div class="tagline">a reason to live</div>
  </div>

  <div class="print-note">Print at 150cm × 60cm · Backlit / LED panel recommended</div>

</body>
</html>
